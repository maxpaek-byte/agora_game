<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타이핑 마스터 | Typing Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-pink: #ff006e;
            --neon-blue: #00f5ff;
            --neon-purple: #b537f2;
            --neon-yellow: #ffbe0b;
            --dark-bg: #0a0e27;
            --darker-bg: #050812;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* 배경 애니메이션 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 245, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(181, 55, 242, 0.1) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 */
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .stats {
            display: flex;
            gap: 30px;
            font-weight: 700;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-family: 'Black Han Sans', sans-serif;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        .lives {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        /* 게임 영역 */
        .game-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .word {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            animation: fall linear;
            cursor: default;
            transition: all 0.3s ease;
        }

        .word:hover {
            transform: scale(1.05);
        }

        @keyframes fall {
            from {
                top: -50px;
            }
            to {
                top: calc(100% - 50px);
            }
        }

        .word-pink {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }

        .word-blue {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }

        .word-purple {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(181, 55, 242, 0.3);
        }

        .word-yellow {
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
            box-shadow: 0 0 20px rgba(255, 190, 11, 0.3);
        }

        /* 입력 영역 */
        .input-area {
            padding: 30px 40px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(10px);
            border-top: 2px solid rgba(255, 255, 255, 0.1);
        }

        .input-wrapper {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        input {
            width: 100%;
            padding: 20px 30px;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            color: white;
            font-family: 'Noto Sans KR', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* 게임 오버 화면 */
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 8, 18, 0.95);
            backdrop-filter: blur(20px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .game-over.active {
            display: flex;
        }

        .game-over-content {
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .game-over-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 4rem;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .final-score {
            font-size: 2rem;
            color: var(--neon-yellow);
            margin-bottom: 40px;
            text-shadow: 0 0 20px var(--neon-yellow);
        }

        button {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.5rem;
            padding: 15px 50px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 0, 110, 0.3);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 0, 110, 0.5);
        }

        button:active {
            transform: translateY(-1px);
        }

        /* 시작 화면 */
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 8, 18, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .start-content {
            text-align: center;
        }

        .start-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 5rem;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 20px rgba(0, 245, 255, 0.5)); }
            50% { filter: brightness(1.3) drop-shadow(0 0 40px rgba(255, 0, 110, 0.7)); }
        }

        .start-subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        .instructions {
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .instructions h3 {
            color: var(--neon-yellow);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .instructions p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            margin-bottom: 10px;
        }

        /* 파티클 효과 */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: particleFade 1s ease-out forwards;
        }

        @keyframes particleFade {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* 레벨업 알림 */
        .level-up {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Black Han Sans', sans-serif;
            font-size: 4rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 40px var(--neon-yellow);
            pointer-events: none;
            animation: levelUpAnim 2s ease-out forwards;
            z-index: 50;
        }

        @keyframes levelUpAnim {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">⚡ 타이핑 마스터</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Level</div>
                    <div class="stat-value" id="level">1</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Lives</div>
                    <div class="stat-value lives" id="lives">❤️❤️❤️</div>
                </div>
            </div>
        </header>

        <div class="game-area" id="gameArea"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="wordInput" 
                    placeholder="여기에 단어를 입력하세요..." 
                    autocomplete="off"
                    disabled
                >
            </div>
        </div>

        <div class="start-screen" id="startScreen">
            <div class="start-content">
                <h1 class="start-title">타이핑 마스터</h1>
                <p class="start-subtitle">TYPING MASTER</p>
                <div class="instructions">
                    <h3>게임 방법</h3>
                    <p>📝 떨어지는 단어를 빠르게 타이핑하세요</p>
                    <p>⚡ 정확히 입력하면 점수를 획득합니다</p>
                    <p>💔 단어가 바닥에 닿으면 생명이 줄어듭니다</p>
                    <p>🎯 레벨이 올라갈수록 속도가 빨라집니다</p>
                </div>
                <button onclick="startGame()">게임 시작</button>
            </div>
        </div>

        <div class="game-over" id="gameOver">
            <div class="game-over-content">
                <h1 class="game-over-title">GAME OVER</h1>
                <p class="final-score">최종 점수: <span id="finalScore">0</span></p>
                <button onclick="restartGame()">다시 시작</button>
            </div>
        </div>
    </div>

    <script>
        const words = [
            '사과', '바나나', '포도', '딸기', '수박', '참외', '복숭아', '자두',
            '컴퓨터', '키보드', '마우스', '모니터', '스피커', '헤드셋',
            '학교', '공원', '도서관', '병원', '은행', '우체국', '편의점',
            '햄버거', '피자', '치킨', '떡볶이', '김밥', '라면', '파스타',
            '축구', '야구', '농구', '배구', '탁구', '테니스', '배드민턴',
            '노래', '춤', '그림', '사진', '영화', '드라마', '게임',
            '친구', '가족', '선생님', '학생', '의사', '간호사', '경찰',
            '봄', '여름', '가을', '겨울', '비', '눈', '바람', '구름',
            '강아지', '고양이', '토끼', '햄스터', '앵무새', '금붕어',
            '책', '연필', '지우개', '공책', '가방', '필통', '자',
            '자동차', '버스', '지하철', '기차', '비행기', '배', '자전거',
            '산', '바다', '강', '호수', '폭포', '계곡', '섬',
            '빨강', '파랑', '노랑', '초록', '검정', '하양', '분홍',
            '피아노', '기타', '드럼', '바이올린', '플루트', '색소폰',
            '사랑', '행복', '희망', '꿈', '용기', '자신감', '열정'
        ];

        let score = 0;
        let level = 1;
        let lives = 3;
        let gameActive = false;
        let fallingWords = [];
        let wordSpeed = 3000;
        let spawnRate = 2000;
        let spawnInterval;
        let gameLoop;

        const colors = ['pink', 'blue', 'purple', 'yellow'];
        const gameArea = document.getElementById('gameArea');
        const wordInput = document.getElementById('wordInput');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const livesDisplay = document.getElementById('lives');
        const gameOverScreen = document.getElementById('gameOver');
        const startScreen = document.getElementById('startScreen');

        function startGame() {
            startScreen.style.display = 'none';
            gameActive = true;
            score = 0;
            level = 1;
            lives = 3;
            wordSpeed = 3000;
            spawnRate = 2000;
            fallingWords = [];
            
            updateDisplay();
            wordInput.disabled = false;
            wordInput.focus();
            
            spawnInterval = setInterval(spawnWord, spawnRate);
            gameLoop = setInterval(checkWords, 100);
        }

        function spawnWord() {
            if (!gameActive) return;
            
            const word = words[Math.floor(Math.random() * words.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const left = Math.random() * (gameArea.offsetWidth - 200);
            
            const wordElement = document.createElement('div');
            wordElement.className = `word word-${color}`;
            wordElement.textContent = word;
            wordElement.style.left = left + 'px';
            wordElement.style.animationDuration = wordSpeed + 'ms';
            
            gameArea.appendChild(wordElement);
            
            fallingWords.push({
                element: wordElement,
                word: word,
                startTime: Date.now()
            });
        }

        function checkWords() {
            if (!gameActive) return;
            
            const now = Date.now();
            fallingWords = fallingWords.filter(wordObj => {
                const elapsed = now - wordObj.startTime;
                if (elapsed >= wordSpeed) {
                    wordObj.element.remove();
                    loseLife();
                    return false;
                }
                return true;
            });
        }

        wordInput.addEventListener('input', (e) => {
            const input = e.target.value.trim();
            if (!input || !gameActive) return;
            
            const matchIndex = fallingWords.findIndex(w => w.word === input);
            if (matchIndex !== -1) {
                const wordObj = fallingWords[matchIndex];
                destroyWord(wordObj.element);
                fallingWords.splice(matchIndex, 1);
                
                score += 10 * level;
                updateScore();
                wordInput.value = '';
                
                if (score > 0 && score % 100 === 0) {
                    levelUp();
                }
            }
        });

        function destroyWord(element) {
            const rect = element.getBoundingClientRect();
            createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
            element.remove();
        }

        function createParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = '8px';
                particle.style.height = '8px';
                particle.style.borderRadius = '50%';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)] === 'pink' ? 'var(--neon-pink)' :
                                          colors[Math.floor(Math.random() * colors.length)] === 'blue' ? 'var(--neon-blue)' :
                                          colors[Math.floor(Math.random() * colors.length)] === 'purple' ? 'var(--neon-purple)' : 'var(--neon-yellow)';
                
                const angle = (Math.PI * 2 * i) / 12;
                const distance = 50 + Math.random() * 30;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        function levelUp() {
            level++;
            wordSpeed = Math.max(1500, wordSpeed - 200);
            spawnRate = Math.max(1000, spawnRate - 150);
            
            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnWord, spawnRate);
            
            const levelUpText = document.createElement('div');
            levelUpText.className = 'level-up';
            levelUpText.textContent = `LEVEL ${level}!`;
            gameArea.appendChild(levelUpText);
            setTimeout(() => levelUpText.remove(), 2000);
            
            updateDisplay();
        }

        function loseLife() {
            lives--;
            updateDisplay();
            
            if (lives <= 0) {
                gameOver();
            }
        }

        function updateScore() {
            scoreDisplay.textContent = score;
        }

        function updateDisplay() {
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            livesDisplay.textContent = '❤️'.repeat(lives);
        }

        function gameOver() {
            gameActive = false;
            clearInterval(spawnInterval);
            clearInterval(gameLoop);
            wordInput.disabled = true;
            
            document.getElementById('finalScore').textContent = score;
            gameOverScreen.classList.add('active');
            
            fallingWords.forEach(w => w.element.remove());
            fallingWords = [];
        }

        function restartGame() {
            gameOverScreen.classList.remove('active');
            gameArea.innerHTML = '';
            startGame();
        }
    </script>
</body>
</html>
