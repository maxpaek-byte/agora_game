<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스네이크 마스터 | Snake Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-pink: #ff006e;
            --neon-blue: #00f5ff;
            --neon-purple: #b537f2;
            --neon-yellow: #ffbe0b;
            --dark-bg: #0a0e27;
            --darker-bg: #050812;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* 배경 애니메이션 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 245, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(181, 55, 242, 0.1) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 */
        header {
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .stats {
            display: flex;
            gap: 30px;
            font-weight: 700;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-family: 'Black Han Sans', sans-serif;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        /* 게임 영역 */
        .game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        canvas {
            border: 2px solid var(--neon-blue);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.2), inset 0 0 30px rgba(0, 245, 255, 0.05);
        }

        /* 오버레이 화면 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 8, 18, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.5s ease;
        }

        .overlay.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .overlay-content {
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .start-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 5rem;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 20px rgba(0, 245, 255, 0.5)); }
            50% { filter: brightness(1.3) drop-shadow(0 0 40px rgba(255, 0, 110, 0.7)); }
        }

        .start-subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        .instructions {
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .instructions h3 {
            color: var(--neon-yellow);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .instructions p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .game-over-title {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 4rem;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .final-score {
            font-size: 2rem;
            color: var(--neon-yellow);
            margin-bottom: 15px;
            text-shadow: 0 0 20px var(--neon-yellow);
        }

        .high-score {
            font-size: 1.2rem;
            color: var(--neon-purple);
            margin-bottom: 40px;
            text-shadow: 0 0 10px var(--neon-purple);
        }

        button {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.5rem;
            padding: 15px 50px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 0, 110, 0.3);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 0, 110, 0.5);
        }

        button:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🐍 스네이크 마스터</div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Best</div>
                    <div class="stat-value" id="best">0</div>
                </div>
            </div>
        </header>

        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="overlay" id="startScreen">
            <div class="overlay-content">
                <h1 class="start-title">스네이크 마스터</h1>
                <p class="start-subtitle">SNAKE MASTER</p>
                <div class="instructions">
                    <h3>게임 방법</h3>
                    <p>⬆⬇⬅➡ 방향키로 뱀을 조종하세요</p>
                    <p>🍎 먹이를 먹으면 점수가 올라갑니다</p>
                    <p>📏 먹이를 먹을수록 뱀이 길어집니다</p>
                    <p>💀 벽이나 자기 몸에 부딪히면 게임 오버!</p>
                </div>
                <button onclick="startGame()">게임 시작</button>
            </div>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <div class="overlay-content">
                <h1 class="game-over-title">GAME OVER</h1>
                <p class="final-score">최종 점수: <span id="finalScore">0</span></p>
                <p class="high-score">최고 점수: <span id="highScore">0</span></p>
                <button onclick="startGame()">다시 시작</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const bestDisplay = document.getElementById('best');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');

        const CELL = 20;
        let COLS, ROWS;
        let snake, direction, nextDirection, food, score, highScore, gameActive, loopId;

        highScore = 0;

        function resizeCanvas() {
            const area = document.querySelector('.game-area');
            const maxW = area.clientWidth - 40;
            const maxH = area.clientHeight - 40;
            COLS = Math.floor(maxW / CELL);
            ROWS = Math.floor(maxH / CELL);
            if (COLS < 10) COLS = 10;
            if (ROWS < 10) ROWS = 10;
            canvas.width = COLS * CELL;
            canvas.height = ROWS * CELL;
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            resizeCanvas();

            snake = [{ x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameActive = true;

            scoreDisplay.textContent = score;
            spawnFood();

            if (loopId) cancelAnimationFrame(loopId);
            let last = 0;
            function loop(timestamp) {
                if (!gameActive) return;
                if (timestamp - last >= getSpeed()) {
                    last = timestamp;
                    update();
                    draw();
                }
                loopId = requestAnimationFrame(loop);
            }
            loopId = requestAnimationFrame(loop);
        }

        function getSpeed() {
            if (score < 50) return 150;
            if (score < 100) return 130;
            if (score < 200) return 110;
            if (score < 300) return 90;
            return 75;
        }

        function spawnFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        function update() {
            direction = { ...nextDirection };
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                gameOver();
                return;
            }

            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawFood();
            drawSnake();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * CELL, 0);
                ctx.lineTo(x * CELL, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * CELL);
                ctx.lineTo(canvas.width, y * CELL);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((seg, i) => {
                const x = seg.x * CELL;
                const y = seg.y * CELL;
                const pad = 1;

                if (i === 0) {
                    ctx.fillStyle = '#00f5ff';
                    ctx.shadowColor = '#00f5ff';
                    ctx.shadowBlur = 15;
                } else {
                    const t = i / snake.length;
                    const r = Math.round(0 + t * 181);
                    const g = Math.round(245 - t * 190);
                    const b = Math.round(255 - t * 13);
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 8;
                }

                ctx.beginPath();
                ctx.roundRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function drawFood() {
            const x = food.x * CELL + CELL / 2;
            const y = food.y * CELL + CELL / 2;
            const r = CELL / 2 - 2;
            const pulseScale = 1 + 0.15 * Math.sin(Date.now() / 200);

            ctx.save();
            ctx.translate(x, y);
            ctx.scale(pulseScale, pulseScale);

            ctx.shadowColor = '#ff006e';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff006e';
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(-r * 0.25, -r * 0.25, r * 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function gameOver() {
            gameActive = false;
            if (loopId) cancelAnimationFrame(loopId);

            if (score > highScore) {
                highScore = score;
                bestDisplay.textContent = highScore;
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('highScore').textContent = highScore;
            gameOverScreen.classList.remove('hidden');
        }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
            }
        });

        window.addEventListener('resize', () => {
            if (!gameActive) resizeCanvas();
        });

        resizeCanvas();
    </script>
</body>
</html>
